async function loadPdfCore(buf, fileName) {
  resetInteractionState();
  pdfBytesOriginal = buf.slice(0); // keep pristine copy
  currentFileName = fileName || "drawing.pdf";
  const loadingTask = pdfjsLib.getDocument({
    data: buf.slice(0),
    // Some PDFs (especially ones with CJK/CID-keyed embedded fonts, common
    // from CAD/technical-drawing software) need external CMap resources to
    // map character codes to glyphs. Without these, pdf.js silently fails to
    // render the TEXT (outlines/lines still render fine, since those don't
    // depend on fonts) — the text was always in the file, it just couldn't
    // be drawn in this preview. The export is unaffected either way, since
    // pdf-lib copies the original font data through untouched.
    cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/",
    cMapPacked: true,
    standardFontDataUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/",
  });
  pdfDocProxy = await loadingTask.promise;
  numPages = pdfDocProxy.numPages;
  currentPage = 1;
  annotations = [];
  nextId = 1;
  repeatMode = false;
  slideMode = false;
  lastNumber = null;
  lastNumbers = null;
  selectedAnnId = null;
  el("btnRepeatToggle").classList.remove("active");
  el("btnSlideToggle").classList.remove("active");
  updateRepeatButtonLabel();

  el("emptyState").style.display = "none";
  el("canvasStack").style.display = "block";
  el("pageNav").style.display = numPages > 1 || true ? "flex" : "none";
  el("sidebarFoot").style.display = "flex";
  el("btnExportProject").style.display = "inline-block";

  await renderPage(currentPage);
  updateSidebar();
}

// ---------- Rendering ----------
// Split into a cheap "layout" pass (viewport math + resizing + overlay redraw,
// which is fast) and an expensive "commit" pass (the actual PDF rasterization,
// which is comparatively slow). Continuous zoom gestures call layout on every
// tick for instant feedback (CSS-stretching the existing bitmap) and debounce
// the expensive commit until the gesture settles, so zooming feels smooth.
let baseRenderToken = 0;

async function layoutForScale(pageNum, newScale) {
  const page = await pdfDocProxy.getPage(pageNum);
  const viewport = page.getViewport({ scale: newScale });
  currentViewport = viewport;

  const stack = el("canvasStack");
  stack.style.width = viewport.width + "px";
  stack.style.height = viewport.height + "px";
  overlayCanvas.style.width = viewport.width + "px";
  overlayCanvas.style.height = viewport.height + "px";
  // Instantly stretch the existing raster bitmap via CSS while a crisp
  // re-render happens in the background — avoids re-rasterizing every tick.
  baseCanvas.style.width = viewport.width + "px";
  baseCanvas.style.height = viewport.height + "px";

  const dpr = window.devicePixelRatio || 1;
  overlayCanvas.width = Math.round(viewport.width * dpr);
  overlayCanvas.height = Math.round(viewport.height * dpr);
  overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  updatePageNav();
  redrawOverlay();
}

async function commitBaseRender(pageNum) {
  const myToken = ++baseRenderToken;
  const page = await pdfDocProxy.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  if (myToken !== baseRenderToken) return; // superseded by a newer request

  const dpr = window.devicePixelRatio || 1;
  let renderFactor = dpr * RENDER_QUALITY;
  const maxDim = Math.max(viewport.width, viewport.height) * renderFactor;
  if (maxDim > MAX_CANVAS_DIM) {
    renderFactor *= MAX_CANVAS_DIM / maxDim;
  }

  baseCanvas.width = Math.round(viewport.width * renderFactor);
  baseCanvas.height = Math.round(viewport.height * renderFactor);
  baseCtx.setTransform(renderFactor, 0, 0, renderFactor, 0, 0);

  await page.render({ canvasContext: baseCtx, viewport }).promise;
  if (myToken !== baseRenderToken) return; // superseded while rendering

  currentViewport = viewport;
  baseCanvas.style.width = viewport.width + "px";
  baseCanvas.style.height = viewport.height + "px";
  redrawOverlay();
}

async function renderPage(pageNum) {
  await layoutForScale(pageNum, scale);
  await commitBaseRender(pageNum);
}

let zoomRenderTimer = null;
function scheduleBaseRender(delay) {
  clearTimeout(zoomRenderTimer);
  zoomRenderTimer = setTimeout(() => {
    commitBaseRender(currentPage);
    scheduleAutoSave();
  }, delay);
}

function updatePageNav() {
  el("pageLabel").textContent = `${currentPage} / ${numPages}`;
  el("zoomLabel").textContent = Math.round((scale / 1.4) * 100) + "%";
  el("prevPage").disabled = currentPage <= 1;
  el("nextPage").disabled = currentPage >= numPages;
}

el("prevPage").addEventListener("click", async () => {
  if (currentPage > 1) { currentPage--; selectedAnnId = null; selectedTextId = null; await renderPage(currentPage); scheduleAutoSave(); }
});
el("nextPage").addEventListener("click", async () => {
  if (currentPage < numPages) { currentPage++; selectedAnnId = null; selectedTextId = null; await renderPage(currentPage); scheduleAutoSave(); }
});
el("zoomIn").addEventListener("click", async () => {
  const curPercent = Math.round((scale / 1.4) * 100);
  const nextPercent = Math.floor(curPercent / 10) * 10 + 10;
  scale = Math.min((nextPercent / 100) * 1.4, 10);
  await layoutForScale(currentPage, scale);
  scheduleBaseRender(120);
});
el("zoomOut").addEventListener("click", async () => {
  const curPercent = Math.round((scale / 1.4) * 100);
  const nextPercent = Math.max(5, Math.ceil(curPercent / 10) * 10 - 10);
  scale = Math.max((nextPercent / 100) * 1.4, 0.1);
  await layoutForScale(currentPage, scale);
  scheduleBaseRender(120);
});

// Ctrl + wheel (and trackpad pinch, which browsers report the same way) zooms
// only the drawing canvas, toward the cursor — never the whole page/UI.
// Snapped to 10% steps, same granularity as the +/- buttons.
let wheelZoomAccum = 0;
canvasZone.addEventListener("wheel", (evt) => {
  if (!evt.ctrlKey || !pdfDocProxy) return;
  evt.preventDefault();
  wheelZoomAccum += evt.deltaY;
  const THRESHOLD = 50; // roughly half a mouse-wheel notch
  if (Math.abs(wheelZoomAccum) < THRESHOLD) return;
  const zoomingIn = wheelZoomAccum < 0;
  wheelZoomAccum = 0;

  const curPercent = Math.round((scale / 1.4) * 100);
  const nextPercent = zoomingIn
    ? Math.floor(curPercent / 10) * 10 + 10
    : Math.max(5, Math.ceil(curPercent / 10) * 10 - 10);
  const newScale = Math.min(10, Math.max(0.1, (nextPercent / 100) * 1.4));
  zoomAtPoint(newScale, evt);
  scheduleBaseRender(150);
}, { passive: false });

async function zoomAtPoint(newScale, evt) {
  const oldPt = getCanvasPoint(evt); // relative to the canvas, before re-layout
  const pdfPt = currentViewport.convertToPdfPoint(oldPt.x, oldPt.y);

  scale = newScale;
  await layoutForScale(currentPage, scale); // cheap — no re-rasterization here

  const newLocal = currentViewport.convertToViewportPoint(pdfPt[0], pdfPt[1]);
  const stackRect = el("canvasStack").getBoundingClientRect();
  const zoneRect = canvasZone.getBoundingClientRect();
  const stackContentOffsetX = stackRect.left - zoneRect.left + canvasZone.scrollLeft;
  const stackContentOffsetY = stackRect.top - zoneRect.top + canvasZone.scrollTop;
  canvasZone.scrollLeft = stackContentOffsetX + newLocal[0] - (evt.clientX - zoneRect.left);
  canvasZone.scrollTop = stackContentOffsetY + newLocal[1] - (evt.clientY - zoneRect.top);
}

// ---------- Two-finger touch: pinch to zoom, drag to pan (combined, like a
// photo app) — tracked globally since fingers can move outside the canvas. ----------
function endTouch(evt) {
  activeTouches.delete(evt.pointerId);
  if (activeTouches.size < 2) pinchState = null;
}

window.addEventListener("pointerdown", (evt) => {
  if (evt.pointerType !== "touch" || !pdfDocProxy) return;
  activeTouches.set(evt.pointerId, { x: evt.clientX, y: evt.clientY });
  if (activeTouches.size === 2) {
    // A second finger just landed — cancel any single-pointer gesture already
    // in progress (drawing, badge drag, resize, move, rotate, one-finger pan).
    drawing = false;
    dragStart = null;
    dragCurrent = null;
    draggingBadge = null;
    dragBadgeStartCanvasPt = null;
    dragBadgeStartOffset = null;
    resizingHandle = null;
    movingRect = null;
    rotatingHandle = null;
    if (isPanning) {
      isPanning = false;
      panStart = null;
      if (pointerLockActive && document.exitPointerLock) document.exitPointerLock();
      pointerLockActive = false;
    }
    setOverlayCursor();
    const pts = [...activeTouches.values()];
    pinchState = { startDist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), startScale: scale };
  } else if (activeTouches.size > 2) {
    pinchState = null; // ignore a third finger rather than jump unpredictably
  }
});

window.addEventListener("pointermove", (evt) => {
  if (evt.pointerType !== "touch" || !activeTouches.has(evt.pointerId)) return;
  activeTouches.set(evt.pointerId, { x: evt.clientX, y: evt.clientY });
  if (activeTouches.size === 2 && pinchState) {
    evt.preventDefault();
    const pts = [...activeTouches.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const midClientX = (pts[0].x + pts[1].x) / 2, midClientY = (pts[0].y + pts[1].y) / 2;
    const newScale = Math.min(10, Math.max(0.1, pinchState.startScale * (dist / pinchState.startDist)));
    zoomAtPoint(newScale, { clientX: midClientX, clientY: midClientY });
    scheduleBaseRender(150);
  }
}, { passive: false });

window.addEventListener("pointerup", endTouch);
window.addEventListener("pointercancel", endTouch);


// ---------- Overlay drawing ----------
function redrawOverlay() {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  const pageAnns = annotations.filter(a => a.page === currentPage);
  pageAnns.forEach(a => drawAnnotationOnOverlay(a));
  const selAnn = pageAnns.find(a => a.id === selectedAnnId);
  if (selAnn) drawSelectionHandles(selAnn);
  if (drawing && dragStart && dragCurrent) {
    drawPreviewRect(dragStart, dragCurrent);
  }
  const pageTexts = textNotes.filter(t => t.page === currentPage);
  pageTexts.forEach(t => drawTextNoteOnOverlay(t));
}

function textNoteFontCss(t) {
  return (t.fontSize ?? DEFAULT_TEXT_FONT_SIZE) * currentViewport.scale;
}

function textNoteScreenPos(t) {
  const p = currentViewport.convertToViewportPoint(t.x, t.y);
  return { x: p[0], y: p[1] };
}

function textNoteScreenBox(t) {
  const pos = textNoteScreenPos(t);
  const fontCss = textNoteFontCss(t);
  const lines = (t.text || "").split("\n");
  const lineHeightCss = fontCss * 1.2;
  overlayCtx.save();
  overlayCtx.font = `bold ${fontCss}px "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif`;
  const w = Math.max(1, ...lines.map(line => overlayCtx.measureText(line).width));
  overlayCtx.restore();
  const pad = 4;
  const totalH = fontCss + (lines.length - 1) * lineHeightCss;
  return {
    x: pos.x - pad, y: pos.y - fontCss - pad,
    w: w + pad * 2, h: totalH + pad * 2,
    textX: pos.x, textY: pos.y, lineHeightCss,
  };
}

function drawTextNoteOnOverlay(t) {
  const color = COLORS[t.color] || COLORS[DEFAULT_COLOR];
  const box = textNoteScreenBox(t);
  if (t.id === selectedTextId) {
    overlayCtx.save();
    overlayCtx.strokeStyle = "#4A3427";
    overlayCtx.lineWidth = 1.5;
    overlayCtx.setLineDash([4, 3]);
    overlayCtx.strokeRect(box.x, box.y, box.w, box.h);
    overlayCtx.restore();
  }
  overlayCtx.save();
  overlayCtx.font = `bold ${textNoteFontCss(t)}px "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif`;
  overlayCtx.fillStyle = color.hex;
  overlayCtx.textAlign = "left";
  overlayCtx.textBaseline = "alphabetic";
  const lines = (t.text || "").split("\n");
  lines.forEach((line, i) => {
    overlayCtx.fillText(line, box.textX, box.textY + i * box.lineHeightCss);
  });
  overlayCtx.restore();
}

function findTextNoteAt(canvasPt) {
  const pageTexts = textNotes.filter(t => t.page === currentPage);
  for (let i = pageTexts.length - 1; i >= 0; i--) {
    const t = pageTexts[i];
    const box = textNoteScreenBox(t);
    if (canvasPt.x >= box.x && canvasPt.x <= box.x + box.w && canvasPt.y >= box.y && canvasPt.y <= box.y + box.h) {
      return t;
    }
  }
  return null;
}

function drawSelectionHandles(a) {
  const corners = rectScreenCorners(a);
  overlayCtx.save();
  overlayCtx.strokeStyle = "#4A3427";
  overlayCtx.lineWidth = 1.5;
  overlayCtx.setLineDash([4, 3]);
  overlayCtx.beginPath();
  overlayCtx.moveTo(corners[0][0], corners[0][1]);
  for (let i = 1; i < 4; i++) overlayCtx.lineTo(corners[i][0], corners[i][1]);
  overlayCtx.closePath();
  overlayCtx.stroke();
  overlayCtx.setLineDash([]);

  const handles = rectHandlePositions(a);
  Object.keys(handles).forEach(key => {
    const p = handles[key];
    overlayCtx.fillStyle = "white";
    overlayCtx.fillRect(p.x - HANDLE_SIZE / 2, p.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
    overlayCtx.lineWidth = 1.5;
    overlayCtx.strokeStyle = "#4A3427";
    overlayCtx.strokeRect(p.x - HANDLE_SIZE / 2, p.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
  });

  const rot = rotateHandlePosition(a);
  overlayCtx.beginPath();
  overlayCtx.moveTo(rot.stemFrom.x, rot.stemFrom.y);
  overlayCtx.lineTo(rot.x, rot.y);
  overlayCtx.strokeStyle = "#4A3427";
  overlayCtx.lineWidth = 1.5;
  overlayCtx.stroke();
  overlayCtx.beginPath();
  overlayCtx.arc(rot.x, rot.y, HANDLE_SIZE / 2 + 1, 0, Math.PI * 2);
  overlayCtx.fillStyle = "white";
  overlayCtx.fill();
  overlayCtx.lineWidth = 1.5;
  overlayCtx.strokeStyle = "#4A3427";
  overlayCtx.stroke();

  overlayCtx.restore();
}

// ---------- Rotation geometry (all in PDF-space, rotation is degrees, standard
// math counter-clockwise convention around the rectangle's own center) ----------
function rotationRad(a) {
  return ((a.rotation || 0) * Math.PI) / 180;
}

function rotateVec(theta, x, y) {
  const cos = Math.cos(theta), sin = Math.sin(theta);
  return { x: x * cos - y * sin, y: x * sin + y * cos };
}

// A local (unrotated) offset relative to the rect's center, rotated into PDF space.
function rotateOffsetToPdf(a, offX, offY) {
  const cx = a.x + a.w / 2, cy = a.y + a.h / 2;
  const v = rotateVec(rotationRad(a), offX, offY);
  return { x: cx + v.x, y: cy + v.y };
}

// The 4 corners of the rectangle in PDF space, rotated around its center.
// Order: bottom-left, bottom-right, top-right, top-left.
// Rotates a PDF-space point around a center by the given angle (degrees,
// standard CCW-positive convention). Used to reposition text anchors when
// counter-rotating for a page's own /Rotate value at export time.
function rotatePdfPointAroundCenter(pt, center, degreesAngle) {
  const rad = (degreesAngle * Math.PI) / 180;
  const v = rotateVec(rad, pt.x - center.x, pt.y - center.y);
  return { x: center.x + v.x, y: center.y + v.y };
}

function rotatedCorners(a) {
  const hw = a.w / 2, hh = a.h / 2;
  return [
    rotateOffsetToPdf(a, -hw, -hh),
    rotateOffsetToPdf(a, hw, -hh),
    rotateOffsetToPdf(a, hw, hh),
    rotateOffsetToPdf(a, -hw, hh),
  ];
}

// Convert a PDF-space point into the rectangle's own local (unrotated) frame —
// makes hit-testing on a rotated rect as simple as the axis-aligned case.
function pdfPointToLocalFrame(a, pt) {
  const cx = a.x + a.w / 2, cy = a.y + a.h / 2;
  const v = rotateVec(-rotationRad(a), pt.x - cx, pt.y - cy);
  return { x: cx + v.x, y: cy + v.y };
}

// Convert a mouse-drag delta from global PDF space into the rectangle's local
// (unrotated) frame, so dragging along the rect's own edges works correctly.
function globalDeltaToLocal(a, dx, dy) {
  return rotateVec(-rotationRad(a), dx, dy);
}

// Which local offset (relative to center, using the given w/h) stays fixed
// when resizing via this handle — i.e. the opposite edge/corner.
function anchorOffsetForHandle(handle, w, h) {
  let x = 0, y = 0;
  if (handle.indexOf("e") !== -1) x = -w / 2;
  else if (handle.indexOf("w") !== -1) x = w / 2;
  if (handle.indexOf("n") !== -1) y = -h / 2;
  else if (handle.indexOf("s") !== -1) y = h / 2;
  return { x, y };
}

function pdfRectToScreen(a) {
  // a.x, a.y = bottom-left corner in pdf points; a.w/h = size in pdf points
  const p1 = currentViewport.convertToViewportPoint(a.x, a.y);
  const p2 = currentViewport.convertToViewportPoint(a.x + a.w, a.y + a.h);
  const sx = Math.min(p1[0], p2[0]);
  const sy = Math.min(p1[1], p2[1]);
  const sw = Math.abs(p2[0] - p1[0]);
  const sh = Math.abs(p2[1] - p1[1]);
  return { sx, sy, sw, sh };
}

// The 4 rotated corners converted to screen (CSS px) space: [bl, br, tr, tl]
function rectScreenCorners(a) {
  return rotatedCorners(a).map(p => currentViewport.convertToViewportPoint(p.x, p.y));
}

// Radius/gap are computed in PDF POINTS (document space) so they scale with
// zoom exactly like the highlight rectangle — this keeps the preview a true
// match for the exported PDF at any zoom level. fontSizePt is used directly
// as the measurement font size; the ratio of glyph-width-to-font-size is
// scale-independent, so this is a safe way to measure the "native" shape.
function overlayBadgeRadiusPt(number, fontSizePt) {
  overlayCtx.save();
  overlayCtx.font = `bold ${fontSizePt}px ui-monospace, monospace`;
  const w = overlayCtx.measureText(String(number)).width;
  overlayCtx.restore();
  return Math.max(fontSizePt * 0.62, w / 2) + 2.5;
}

const BADGE_GAP = 3; // clear space between the badge's edge and the highlight, in points
const BADGE_OVERLAP = 1; // neighbouring circles in a multi-number badge overlap slightly so they read as one group
const MAX_BADGE_COUNT = 30;

// ---------- Multi-number badges ----------
// A marker may carry several numbers, consecutive or not (e.g. ②③④ or ②⑦).
// a.numbers holds the sorted list and a.number mirrors its first entry (used
// for sorting). Older files that only have a.number (ver_3) or a.number +
// a.count (ver_4) are still read correctly.
function annNumbers(a) {
  if (a && Array.isArray(a.numbers) && a.numbers.length > 0) return a.numbers;
  const c = parseInt(a && a.count, 10);
  const n = c > 1 ? Math.min(c, MAX_BADGE_COUNT) : 1;
  return Array.from({ length: n }, (_, i) => a.number + i);
}
function annCount(a) { return annNumbers(a).length; }
function setAnnNumbers(a, nums) {
  const clean = [...new Set(nums)].sort((p, q) => p - q);
  a.numbers = clean;
  a.number = clean[0];
  delete a.count;
}
// [2,3,4,7,9,10] → "2-4,7,9-10"
function formatNumberList(nums) {
  const parts = [];
  for (let i = 0; i < nums.length; ) {
    let j = i;
    while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
    parts.push(j - i >= 2 ? `${nums[i]}-${nums[j]}` : nums.slice(i, j + 1).join(","));
    i = j + 1;
  }
  return parts.join(",");
}
function annLabel(a) { return formatNumberList(annNumbers(a)); }

// Lays the circles out in a row along the screen's horizontal axis, centred
// on the badge centre. Offsets/radii are in PDF points. radiusFn lets the
// exporter use the embedded PDF font's metrics instead of the canvas's.
function badgeLayout(a, radiusFn) {
  const fs = a.fontSize ?? DEFAULT_FONT_SIZE;
  const rf = radiusFn || ((n) => overlayBadgeRadiusPt(n, fs));
  const nums = annNumbers(a);
  const radii = nums.map(n => rf(n));
  const total = radii.reduce((sum, r) => sum + 2 * r, 0) - BADGE_OVERLAP * (nums.length - 1);
  let cursor = -total / 2;
  const items = nums.map((n, i) => {
    const r = radii[i];
    const off = cursor + r;
    cursor += 2 * r - BADGE_OVERLAP;
    return { n, r, off };
  });
  return { items, halfW: total / 2, halfH: Math.max(...radii) };
}

// Each circle's centre in PDF space.
function badgeCirclesPt(a, radiusFn) {
  const center = badgeCenterPt(a);
  const left = screenLeftCardinalDir();
  const right = { x: -left.x, y: -left.y };
  return badgeLayout(a, radiusFn).items.map(it => ({
    n: it.n, r: it.r,
    x: center.x + right.x * it.off,
    y: center.y + right.y * it.off,
  }));
}

// Accepts "5", "2-4", "2,7", "2-4,7", "２－４、７", "②③④⑦" … and returns
// { numbers } (sorted, unique), { error }, or null when nothing numeric was typed.
function parseNumberSpec(raw) {
  let s = String(raw ?? "").trim();
  s = s.replace(/[\u2460-\u2473]/g, ch => "," + (ch.charCodeAt(0) - 0x2460 + 1) + ",");
  s = s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  s = s.replace(/\s*[－ー―‐−–—~〜～-]\s*/g, "-");
  s = s.replace(/[，、・.。\/／\s]+/g, ",").replace(/,+/g, ",").replace(/^,|,$/g, "");
  if (s === "") return null;
  const nums = [];
  for (const tok of s.split(",")) {
    const m = tok.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) return null;
    let x = +m[1], y = m[2] !== undefined ? +m[2] : x;
    if (y < x) [x, y] = [y, x];
    if (y - x + 1 > MAX_BADGE_COUNT) return { error: `1つの枠に付けられる番号は${MAX_BADGE_COUNT}個までです` };
    for (let n = x; n <= y; n++) nums.push(n);
  }
  const unique = [...new Set(nums)].sort((p, q) => p - q);
  if (unique.length > MAX_BADGE_COUNT) return { error: `1つの枠に付けられる番号は${MAX_BADGE_COUNT}個までです` };
  return { numbers: unique };
}

// Applies a parsed spec to a marker (handles undo + slide mode).
function applyNumberSpec(a, spec) {
  const cur = annNumbers(a);
  const next = spec.numbers;
  const changed = cur.length !== next.length || cur.some((n, i) => n !== next[i]);
  if (changed) {
    pushUndo();
    if (slideMode) { insertNumberWithShift(a.id, next); }
    else { setAnnNumbers(a, next); }
  }
  lastNumber = annNumbers(a)[0];
  lastNumbers = annNumbers(a).slice();
  return changed;
}

// Determine which raw PDF-space axis/direction corresponds to "left on
// screen" for the page as currently displayed. Page rotation (a PDF page
// property, separate from any rotation the user applies to a shape) is
// always a multiple of 90°, so this is always one of the 4 cardinal
// directions — but which one depends on that rotation. Used so the default
// badge position appears visually to the left regardless of page rotation.
function screenLeftCardinalDir() {
  if (!currentViewport) return { x: -1, y: 0 };
  const origin = currentViewport.convertToPdfPoint(0, 0);
  const leftPt = currentViewport.convertToPdfPoint(-100, 0);
  const dx = leftPt[0] - origin[0], dy = leftPt[1] - origin[1];
  if (Math.abs(dx) >= Math.abs(dy)) {
    return { x: dx > 0 ? 1 : -1, y: 0 };
  }
  return { x: 0, y: dy > 0 ? 1 : -1 };
}

// Same idea as screenLeftCardinalDir, but for "up on screen" — used to attach
// the rotate handle to whichever local edge is visually on top, accounting
// for the page's own rotation.
function screenUpCardinalDir() {
  if (!currentViewport) return { x: 0, y: 1 };
  const origin = currentViewport.convertToPdfPoint(0, 0);
  const upPt = currentViewport.convertToPdfPoint(0, -100); // 100px up on screen
  const dx = upPt[0] - origin[0], dy = upPt[1] - origin[1];
  if (Math.abs(dx) >= Math.abs(dy)) {
    return { x: dx > 0 ? 1 : -1, y: 0 };
  }
  return { x: 0, y: dy > 0 ? 1 : -1 };
}

// Default badge offset (in points), as a full local offset from the
// rectangle's center: attaches to whichever edge is visually on the left of
// the highlight (accounting for page rotation) and pushes out by the badge's
// own radius + a gap, sized to the actual number so it never overlaps.
function defaultBadgeOffsetPt(a) {
  const w = a.w, h = a.h;
  const dist = badgeLayout(a).halfW + BADGE_GAP; // group is laid out along screen-horizontal, i.e. along the "left" axis
  const dir = screenLeftCardinalDir();
  const hw = (w || 0) / 2, hh = (h || 0) / 2;
  return { x: dir.x * (hw + dist), y: dir.y * (hh + dist) };
}

function badgeCenterPt(a) {
  // The badge's position is stored as a LOCAL offset (relative to the rect's
  // center, in the rectangle's own unrotated frame) so it rotates together
  // with the rectangle instead of staying fixed in absolute space.
  const def = defaultBadgeOffsetPt(a);
  const offX = a.numOffsetX ?? def.x;
  const offY = a.numOffsetY ?? def.y;
  return rotateOffsetToPdf(a, offX, offY);
}

function nearestCorner(a) {
  const corners = rotatedCorners(a);
  const badge = badgeCenterPt(a);
  let best = corners[0], bestDist = Infinity;
  for (const c of corners) {
    const d = (c.x - badge.x) ** 2 + (c.y - badge.y) ** 2;
    if (d < bestDist) { bestDist = d; best = c; }
  }
  return best;
}

function badgeScreenCenter(a) {
  const centerPdf = badgeCenterPt(a);
  const p = currentViewport.convertToViewportPoint(centerPdf.x, centerPdf.y);
  return { bx: p[0], by: p[1] };
}

function drawAnnotationOnOverlay(a) {
  const corners = rectScreenCorners(a); // [bl, br, tr, tl]
  const color = COLORS[a.color] || COLORS[DEFAULT_COLOR];
  const bw = a.borderWidth ?? DEFAULT_BORDER_WIDTH;
  const op = a.opacity ?? DEFAULT_OPACITY;
  const fontSizePt = a.fontSize ?? DEFAULT_FONT_SIZE;
  const vScale = currentViewport.scale;
  const fontCss = fontSizePt * vScale;
  overlayCtx.save();
  overlayCtx.beginPath();
  overlayCtx.moveTo(corners[0][0], corners[0][1]);
  for (let i = 1; i < 4; i++) overlayCtx.lineTo(corners[i][0], corners[i][1]);
  overlayCtx.closePath();
  overlayCtx.globalAlpha = op;
  overlayCtx.fillStyle = color.hex;
  overlayCtx.fill();
  overlayCtx.globalAlpha = 1;
  if (bw > 0) {
    overlayCtx.strokeStyle = color.hex;
    overlayCtx.lineWidth = bw;
    overlayCtx.stroke();
  }

  const { bx, by } = badgeScreenCenter(a);

  if (a.showLeader) {
    const corner = nearestCorner(a);
    const cornerScreen = currentViewport.convertToViewportPoint(corner.x, corner.y);
    overlayCtx.save();
    overlayCtx.strokeStyle = color.hex;
    overlayCtx.lineWidth = 1.25;
    overlayCtx.setLineDash([4, 3]);
    overlayCtx.beginPath();
    overlayCtx.moveTo(cornerScreen[0], cornerScreen[1]);
    overlayCtx.lineTo(bx, by);
    overlayCtx.stroke();
    overlayCtx.restore();
  }

  // number badge(s) — draggable as one group, positioned at anchor + user offset
  for (const it of badgeLayout(a).items) {
    const cx = bx + it.off * vScale;
    overlayCtx.beginPath();
    overlayCtx.arc(cx, by, it.r * vScale, 0, Math.PI * 2);
    overlayCtx.fillStyle = color.hex;
    overlayCtx.fill();
    overlayCtx.lineWidth = 1.5;
    overlayCtx.strokeStyle = "white";
    overlayCtx.stroke();

    overlayCtx.fillStyle = color.textHex || "white";
    overlayCtx.font = `bold ${fontCss}px ui-monospace, monospace`;
    overlayCtx.textAlign = "center";
    overlayCtx.textBaseline = "middle";
    overlayCtx.fillText(String(it.n), cx, by + 1);
  }
  overlayCtx.restore();
}

function drawPreviewRect(start, current) {
  const sx = Math.min(start.x, current.x);
  const sy = Math.min(start.y, current.y);
  const sw = Math.abs(current.x - start.x);
  const sh = Math.abs(current.y - start.y);
  const color = COLORS[DEFAULT_COLOR];
  overlayCtx.save();
  overlayCtx.setLineDash([5, 4]);
  overlayCtx.strokeStyle = color.hex;
  overlayCtx.lineWidth = 1.5;
  overlayCtx.strokeRect(sx, sy, sw, sh);
  overlayCtx.restore();
}

// ---------- Mouse interaction (draw + pan + drag badge) ----------
let panMode = false;
let spaceHeld = false;
let isPanning = false;
let panStart = null; // {clientX, clientY, scrollLeft, scrollTop} — fallback when pointer lock isn't available
let pointerLockActive = false;
let activeTouches = new Map(); // pointerId -> {x, y} (clientX/clientY), touch pointers only
let pinchState = null;         // {startDist, startScale, anchorPdfX, anchorPdfY}
let draggingBadge = null; // annotation currently being dragged by its number badge
let dragBadgeStartCanvasPt = null;
let dragBadgeStartOffset = null;
let selectedAnnId = null;   // id of the annotation currently selected for resize/move
let resizingHandle = null;  // {ann, handle, startX, startY, startW, startH, startCanvasPt, fixedGlobal}
let movingRect = null;      // {ann, startCanvasPt, startX, startY}
let rotatingHandle = null;  // {ann, startMouseAngle, startRotation}
const HANDLE_SIZE = 8;      // visual square size, px
const HANDLE_HIT_R = 8;     // hit-test radius, px

document.addEventListener("pointerlockchange", () => {
  pointerLockActive = (document.pointerLockElement === overlayCanvas);
});
document.addEventListener("pointerlockerror", () => {
  pointerLockActive = false; // silently fall back to normal cursor-tracked panning
});

function getCanvasPoint(evt) {
  const rect = overlayCanvas.getBoundingClientRect();
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

function isPanRequested(evt) {
  return panMode || spaceHeld || evt.button === 1 || evt.button === 2;
}

function setOverlayCursor() {
  if (isPanning) { overlayCanvas.style.cursor = "grabbing"; return; }
  if (draggingBadge) { overlayCanvas.style.cursor = "move"; return; }
  if (resizingHandle) { overlayCanvas.style.cursor = handleCursor(resizingHandle.handle); return; }
  if (movingRect) { overlayCanvas.style.cursor = "move"; return; }
  if (rotatingHandle) { overlayCanvas.style.cursor = "grabbing"; return; }
  if (draggingText) { overlayCanvas.style.cursor = "move"; return; }
  if (addTextMode) { overlayCanvas.style.cursor = "text"; return; }
  overlayCanvas.style.cursor = (panMode || spaceHeld) ? "grab" : "crosshair";
}

function handleCursor(handle) {
  const map = {
    n: "ns-resize", s: "ns-resize",
    e: "ew-resize", w: "ew-resize",
    nw: "nwse-resize", se: "nwse-resize",
    ne: "nesw-resize", sw: "nesw-resize",
  };
  return map[handle] || "crosshair";
}

function findBadgeAt(canvasPt) {
  const pageAnns = annotations.filter(a => a.page === currentPage);
  // check topmost (last drawn) first
  for (let i = pageAnns.length - 1; i >= 0; i--) {
    const a = pageAnns[i];
    const { bx, by } = badgeScreenCenter(a);
    const vs = currentViewport.scale;
    for (const it of badgeLayout(a).items) {
      const dx = canvasPt.x - (bx + it.off * vs), dy = canvasPt.y - by;
      if (Math.sqrt(dx * dx + dy * dy) <= it.r * vs + 4) return a;
    }
  }
  return null;
}

function rectHandlePositions(a) {
  const [bl, br, tr, tl] = rectScreenCorners(a);
  const mid = (p1, p2) => ({ x: (p1[0] + p2[0]) / 2, y: (p1[1] + p2[1]) / 2 });
  return {
    sw: { x: bl[0], y: bl[1] }, s: mid(bl, br), se: { x: br[0], y: br[1] },
    w: mid(bl, tl),                              e: mid(br, tr),
    nw: { x: tl[0], y: tl[1] }, n: mid(tl, tr), ne: { x: tr[0], y: tr[1] },
  };
}

// Position of the rotate handle: a short stem out from whichever local edge
// is visually on top (accounting for page rotation), in screen space so its
// distance from the shape stays constant regardless of zoom.
function rotateHandlePosition(a) {
  const [bl, br, tr, tl] = rectScreenCorners(a);
  const upDir = screenUpCardinalDir();
  let topMid;
  if (upDir.y === 1) topMid = { x: (tr[0] + tl[0]) / 2, y: (tr[1] + tl[1]) / 2 }; // raw +Y edge
  else if (upDir.y === -1) topMid = { x: (bl[0] + br[0]) / 2, y: (bl[1] + br[1]) / 2 }; // raw -Y edge
  else if (upDir.x === 1) topMid = { x: (br[0] + tr[0]) / 2, y: (br[1] + tr[1]) / 2 }; // raw +X edge
  else topMid = { x: (bl[0] + tl[0]) / 2, y: (bl[1] + tl[1]) / 2 }; // raw -X edge
  const centerPdf = { x: a.x + a.w / 2, y: a.y + a.h / 2 };
  const centerScreen = currentViewport.convertToViewportPoint(centerPdf.x, centerPdf.y);
  const dx = topMid.x - centerScreen[0], dy = topMid.y - centerScreen[1];
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const DIST = 22;
  return {
    x: topMid.x + (dx / len) * DIST,
    y: topMid.y + (dy / len) * DIST,
    stemFrom: topMid,
  };
}

function findRotateHandleAt(canvasPt, a) {
  const rot = rotateHandlePosition(a);
  const dx = canvasPt.x - rot.x, dy = canvasPt.y - rot.y;
  return Math.sqrt(dx * dx + dy * dy) <= HANDLE_HIT_R + 2;
}

function findHandleAt(canvasPt, a) {
  const handles = rectHandlePositions(a);
  for (const key in handles) {
    const p = handles[key];
    const dx = canvasPt.x - p.x, dy = canvasPt.y - p.y;
    if (Math.sqrt(dx * dx + dy * dy) <= HANDLE_HIT_R) return key;
  }
  return null;
}

function pointInRect(canvasPt, a) {
  const pdfPt = currentViewport.convertToPdfPoint(canvasPt.x, canvasPt.y);
  const local = pdfPointToLocalFrame(a, { x: pdfPt[0], y: pdfPt[1] });
  return local.x >= a.x && local.x <= a.x + a.w && local.y >= a.y && local.y <= a.y + a.h;
}

// Selecting a rectangle requires clicking near its border, not just anywhere
// inside it — this way clicking deep inside an existing highlight still lets
// you draw a new, possibly-overlapping one, which the tool depends on.
function findRectBorderAt(canvasPt, tolerancePx) {
  tolerancePx = tolerancePx || 7;
  const pageAnns = annotations.filter(a => a.page === currentPage);
  const pdfPt = currentViewport.convertToPdfPoint(canvasPt.x, canvasPt.y);
  for (let i = pageAnns.length - 1; i >= 0; i--) {
    const a = pageAnns[i];
    const tolerance = tolerancePx / currentViewport.scale;
    const local = pdfPointToLocalFrame(a, { x: pdfPt[0], y: pdfPt[1] });
    const sx = a.x, sy = a.y, sw = a.w, sh = a.h;
    const withinX = local.x >= sx - tolerance && local.x <= sx + sw + tolerance;
    const withinY = local.y >= sy - tolerance && local.y <= sy + sh + tolerance;
    const nearLeft = withinY && Math.abs(local.x - sx) <= tolerance;
    const nearRight = withinY && Math.abs(local.x - (sx + sw)) <= tolerance;
    const nearBottom = withinX && Math.abs(local.y - sy) <= tolerance;
    const nearTop = withinX && Math.abs(local.y - (sy + sh)) <= tolerance;
    if (nearLeft || nearRight || nearTop || nearBottom) return a;
  }
  return null;
}

el("btnPanToggle").addEventListener("click", () => {
  panMode = !panMode;
  el("btnPanToggle").classList.toggle("active", panMode);
  setOverlayCursor();
});

// Hold Space for a temporary pan, like design tools. Ignored while typing.
window.addEventListener("keydown", (evt) => {
  if (evt.code === "Space" && !spaceHeld) {
    const tag = (evt.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    spaceHeld = true;
    setOverlayCursor();
    evt.preventDefault();
  }
});
window.addEventListener("keyup", (evt) => {
  if (evt.code === "Space") {
    spaceHeld = false;
    setOverlayCursor();
  }
});

overlayCanvas.addEventListener("pointermove", (evt) => {
  if (drawing || draggingBadge || draggingText || resizingHandle || movingRect || rotatingHandle || isPanning || panMode || spaceHeld) return;
  const pt = getCanvasPoint(evt);
  if (addTextMode) { overlayCanvas.style.cursor = "text"; return; }
  if (findBadgeAt(pt)) { overlayCanvas.style.cursor = "move"; return; }
  if (findTextNoteAt(pt)) { overlayCanvas.style.cursor = "move"; return; }
  if (selectedAnnId != null) {
    const selAnn = annotations.find(a => a.id === selectedAnnId && a.page === currentPage);
    if (selAnn) {
      if (findRotateHandleAt(pt, selAnn)) { overlayCanvas.style.cursor = "grab"; return; }
      const handle = findHandleAt(pt, selAnn);
      if (handle) { overlayCanvas.style.cursor = handleCursor(handle); return; }
      if (pointInRect(pt, selAnn)) { overlayCanvas.style.cursor = "move"; return; }
    }
  }
  overlayCanvas.style.cursor = "crosshair";
});

overlayCanvas.addEventListener("contextmenu", (evt) => evt.preventDefault());

overlayCanvas.addEventListener("dblclick", (evt) => {
  const pt = getCanvasPoint(evt);
  const hit = findBadgeAt(pt);
  if (hit) {
    evt.preventDefault();
    openBadgeNumberEditor(hit);
    return;
  }
  const hitText = findTextNoteAt(pt);
  if (hitText) {
    evt.preventDefault();
    openTextNoteEditor(hitText);
  }
});

function openBadgeNumberEditor(a) {
  const existing = document.querySelector(".badgeEditInput");
  if (existing) existing.remove();

  const { bx, by } = badgeScreenCenter(a);
  const halfWCss = badgeLayout(a).halfW * currentViewport.scale;
  const w = Math.max(72, halfWCss * 2 + 12);

  const input = document.createElement("input");
  input.type = "text";
  input.className = "badgeEditInput";
  input.title = "「2-4」で②③④、「2,7」で②⑦のように、1つの枠に複数の番号を付けられます";
  input.value = annLabel(a);
  input.style.left = (bx - w / 2) + "px";
  input.style.top = (by - 13) + "px";
  input.style.width = w + "px";

  el("canvasStack").appendChild(input);
  input.focus();
  input.select();

  let done = false;
  function commit() {
    if (done) return;
    done = true;
    const spec = parseNumberSpec(input.value);
    if (spec && spec.error) {
      setDraftStatus(spec.error, true);
    } else if (spec) {
      applyNumberSpec(a, spec);
      updateRepeatButtonLabel();
      updateSidebar();
      redrawOverlay();
    }
    input.remove();
  }
  function cancel() {
    if (done) return;
    done = true;
    input.remove();
  }
  input.addEventListener("click", (ev) => ev.stopPropagation());
  input.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); commit(); }
    else if (ev.key === "Escape") { ev.preventDefault(); cancel(); }
  });
}

function openTextNoteEditor(note, opts) {
  opts = opts || {};
  const isNew = !!opts.isNew;
  document.querySelectorAll(".textNoteEditInput, .badgeEditInput").forEach(el2 => el2.remove());

  // A pointerdown with touch-action:none can leave the canvas holding implicit
  // pointer capture, which can silently block focus from moving to a new
  // element created mid-gesture. Release it defensively before focusing.
  try {
    if (overlayCanvas.hasPointerCapture) {
      if (typeof overlayCanvas.releaseCapture === "function") overlayCanvas.releaseCapture();
    }
  } catch (e) { /* ignore */ }

  const box = textNoteScreenBox(note);
  const fontCss = textNoteFontCss(note);

  const input = document.createElement("textarea");
  input.rows = 1;
  input.className = "textNoteEditInput";
  input.value = note.text || "";
  input.placeholder = "文字を入力";
  input.style.left = Math.round(box.x) + "px";
  input.style.top = Math.round(box.y) + "px";
  input.style.width = Math.max(220, Math.round(box.w) + 10) + "px";
  input.style.color = (COLORS[note.color] || COLORS[DEFAULT_COLOR]).hex;
  input.style.fontSize = Math.max(11, Math.round(fontCss)) + "px";

  const stack = el("canvasStack");
  stack.appendChild(input);

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  }
  autoGrow();
  input.addEventListener("input", autoGrow);

  // Defer focus to the next tick — focusing synchronously inside the same
  // pointerdown that created the element can be swallowed by the browser
  // while the originating pointer gesture is still active.
  setTimeout(() => {
    input.focus();
    input.select();
  }, 0);

  let done = false;
  function commit() {
    if (done) return;
    done = true;
    const raw = input.value;
    if (raw.trim() === "") {
      // Never typed anything — don't add a note at all. If editing an
      // existing note down to empty, remove it instead of leaving a blank one.
      if (!isNew) {
        textNotes = textNotes.filter(t => t.id !== note.id);
        if (selectedTextId === note.id) selectedTextId = null;
      }
    } else if (isNew) {
      pushUndo();
      note.text = raw;
      textNotes.push(note);
      selectedTextId = note.id;
      lastAddedTextId = note.id;
    } else if (raw !== note.text) {
      pushUndo();
      note.text = raw;
    }
    input.remove();
    updateSidebar();
    redrawOverlay();
  }
  function cancel() {
    if (done) return;
    done = true;
    // isNew notes were never added to textNotes, so cancelling just discards
    // the draft — nothing to clean up.
    input.remove();
    updateSidebar();
    redrawOverlay();
  }
  input.addEventListener("click", (ev) => ev.stopPropagation());
  input.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { ev.preventDefault(); cancel(); }
    else if (ev.key === "Enter") { setTimeout(autoGrow, 0); } // let it insert a newline normally
  });
}

overlayCanvas.addEventListener("pointerdown", (evt) => {
  if (isPanRequested(evt)) {
    evt.preventDefault();
    isPanning = true;
    panStart = {
      clientX: evt.clientX, clientY: evt.clientY,
      scrollLeft: canvasZone.scrollLeft, scrollTop: canvasZone.scrollTop,
    };
    pointerLockActive = false;
    if (overlayCanvas.requestPointerLock) {
      try {
        const req = overlayCanvas.requestPointerLock();
        if (req && typeof req.then === "function") {
          req.catch(() => { pointerLockActive = false; });
        }
      } catch (e) { /* not available (e.g. restricted iframe) — falls back to normal drag */ }
    }
    setOverlayCursor();
    return;
  }
  const pt = getCanvasPoint(evt);

  if (addTextMode) {
    const pdfPt = currentViewport.convertToPdfPoint(pt.x, pt.y);
    const note = {
      id: nextTextId++,
      page: currentPage,
      x: pdfPt[0], y: pdfPt[1],
      text: "",
      color: lastTextColor,
      fontSize: DEFAULT_TEXT_FONT_SIZE,
    };
    openTextNoteEditor(note, { isNew: true });
    return;
  }

  const hitText = findTextNoteAt(pt);
  if (hitText) {
    selectedTextId = hitText.id;
    draggingText = { note: hitText, startCanvasPt: pt, startX: hitText.x, startY: hitText.y, moved: false };
    updateSidebar();
    redrawOverlay();
    setOverlayCursor();
    return;
  } else if (selectedTextId != null) {
    selectedTextId = null;
    updateSidebar();
    redrawOverlay();
  }

  const hit = findBadgeAt(pt);
  if (hit) {
    pushUndo();
    draggingBadge = hit;
    dragBadgeStartCanvasPt = pt;
    const d = defaultBadgeOffsetPt(hit);
    dragBadgeStartOffset = { x: hit.numOffsetX ?? d.x, y: hit.numOffsetY ?? d.y };
    setOverlayCursor();
    return;
  }

  // Resize / rotate / move the currently selected rectangle
  if (selectedAnnId != null) {
    const selAnn = annotations.find(a => a.id === selectedAnnId && a.page === currentPage);
    if (selAnn) {
      if (findRotateHandleAt(pt, selAnn)) {
        const centerPdf = { x: selAnn.x + selAnn.w / 2, y: selAnn.y + selAnn.h / 2 };
        const startPdfPt = currentViewport.convertToPdfPoint(pt.x, pt.y);
        const startMouseAngle = Math.atan2(startPdfPt[1] - centerPdf.y, startPdfPt[0] - centerPdf.x);
        rotatingHandle = { ann: selAnn, startMouseAngle, startRotation: selAnn.rotation || 0, startPt: pt, hasRotated: false };
        setOverlayCursor();
        return;
      }
      const handle = findHandleAt(pt, selAnn);
      if (handle) {
        pushUndo();
        const ao = anchorOffsetForHandle(handle, selAnn.w, selAnn.h);
        const rotatedAo = rotateVec(rotationRad(selAnn), ao.x, ao.y);
        const cx = selAnn.x + selAnn.w / 2, cy = selAnn.y + selAnn.h / 2;
        resizingHandle = {
          ann: selAnn, handle,
          startX: selAnn.x, startY: selAnn.y, startW: selAnn.w, startH: selAnn.h,
          startCanvasPt: pt,
          fixedGlobal: { x: cx + rotatedAo.x, y: cy + rotatedAo.y },
        };
        setOverlayCursor();
        return;
      }
      if (pointInRect(pt, selAnn)) {
        pushUndo();
        movingRect = { ann: selAnn, startCanvasPt: pt, startX: selAnn.x, startY: selAnn.y };
        setOverlayCursor();
        return;
      }
    }
  }

  // Clicking near an existing rectangle's edge selects it (shows handles),
  // without moving it or starting a new draw on this same click.
  const borderHit = findRectBorderAt(pt);
  if (borderHit) {
    selectedAnnId = borderHit.id;
    redrawOverlay();
    return;
  }

  if (selectedAnnId != null) {
    selectedAnnId = null;
    redrawOverlay();
  }
  drawing = true;
  dragStart = pt;
  dragCurrent = dragStart;
});
window.addEventListener("pointermove", (evt) => {
  if (isPanning && panStart) {
    if (pointerLockActive) {
      canvasZone.scrollLeft -= evt.movementX;
      canvasZone.scrollTop -= evt.movementY;
    } else {
      canvasZone.scrollLeft = panStart.scrollLeft - (evt.clientX - panStart.clientX);
      canvasZone.scrollTop = panStart.scrollTop - (evt.clientY - panStart.clientY);
    }
    return;
  }
  if (draggingBadge) {
    const pt = getCanvasPoint(evt);
    const startPdf = currentViewport.convertToPdfPoint(dragBadgeStartCanvasPt.x, dragBadgeStartCanvasPt.y);
    const curPdf = currentViewport.convertToPdfPoint(pt.x, pt.y);
    const localDelta = globalDeltaToLocal(draggingBadge, curPdf[0] - startPdf[0], curPdf[1] - startPdf[1]);
    draggingBadge.numOffsetX = dragBadgeStartOffset.x + localDelta.x;
    draggingBadge.numOffsetY = dragBadgeStartOffset.y + localDelta.y;
    redrawOverlay();
    return;
  }
  if (draggingText) {
    const pt = getCanvasPoint(evt);
    const movedPx = Math.hypot(pt.x - draggingText.startCanvasPt.x, pt.y - draggingText.startCanvasPt.y);
    if (!draggingText.moved) {
      if (movedPx < 4) return; // dead-zone: a plain click shouldn't count as a drag
      draggingText.moved = true;
      pushUndo();
    }
    const startPdf = currentViewport.convertToPdfPoint(draggingText.startCanvasPt.x, draggingText.startCanvasPt.y);
    const curPdf = currentViewport.convertToPdfPoint(pt.x, pt.y);
    draggingText.note.x = draggingText.startX + (curPdf[0] - startPdf[0]);
    draggingText.note.y = draggingText.startY + (curPdf[1] - startPdf[1]);
    redrawOverlay();
    return;
  }
  if (resizingHandle) {
    const pt = getCanvasPoint(evt);
    const startPdf = currentViewport.convertToPdfPoint(resizingHandle.startCanvasPt.x, resizingHandle.startCanvasPt.y);
    const curPdf = currentViewport.convertToPdfPoint(pt.x, pt.y);
    const { ann, handle, startW, startH, fixedGlobal } = resizingHandle;
    const localDelta = globalDeltaToLocal(ann, curPdf[0] - startPdf[0], curPdf[1] - startPdf[1]);

    let newW = startW, newH = startH;
    if (handle.indexOf("e") !== -1) newW = startW + localDelta.x;
    if (handle.indexOf("w") !== -1) newW = startW - localDelta.x;
    if (handle.indexOf("n") !== -1) newH = startH + localDelta.y;
    if (handle.indexOf("s") !== -1) newH = startH - localDelta.y;
    const MIN_SIZE = 3;
    newW = Math.max(newW, MIN_SIZE);
    newH = Math.max(newH, MIN_SIZE);

    // Recompute the new center so the point opposite the dragged handle
    // (the anchor) stays exactly where it was, even though the rect is rotated.
    const ao = anchorOffsetForHandle(handle, newW, newH);
    const rotatedAo = rotateVec(rotationRad(ann), ao.x, ao.y);
    const newCenter = { x: fixedGlobal.x - rotatedAo.x, y: fixedGlobal.y - rotatedAo.y };

    ann.w = newW;
    ann.h = newH;
    ann.x = newCenter.x - newW / 2;
    ann.y = newCenter.y - newH / 2;
    redrawOverlay();
    return;
  }
  if (movingRect) {
    const pt = getCanvasPoint(evt);
    const startPdf = currentViewport.convertToPdfPoint(movingRect.startCanvasPt.x, movingRect.startCanvasPt.y);
    const curPdf = currentViewport.convertToPdfPoint(pt.x, pt.y);
    movingRect.ann.x = movingRect.startX + (curPdf[0] - startPdf[0]);
    movingRect.ann.y = movingRect.startY + (curPdf[1] - startPdf[1]);
    redrawOverlay();
    return;
  }
  if (rotatingHandle) {
    const pt = getCanvasPoint(evt);
    const { ann, startMouseAngle, startRotation, startPt } = rotatingHandle;
    const movedPx = Math.hypot(pt.x - startPt.x, pt.y - startPt.y);
    if (!rotatingHandle.hasRotated) {
      if (movedPx < 4) return; // dead-zone: ignore tiny movement from a plain click
      rotatingHandle.hasRotated = true;
      pushUndo();
    }
    const centerPdf = { x: ann.x + ann.w / 2, y: ann.y + ann.h / 2 };
    const curPdfPt = currentViewport.convertToPdfPoint(pt.x, pt.y);
    const curMouseAngle = Math.atan2(curPdfPt[1] - centerPdf.y, curPdfPt[0] - centerPdf.x);
    // Both angles are measured directly in PDF's native y-up space (via
    // convertToPdfPoint), so no sign flip or extra offset is needed here —
    // this stays correct even when the page itself has a /Rotate value.
    const deltaDeg = ((curMouseAngle - startMouseAngle) * 180) / Math.PI;
    ann.rotation = startRotation + deltaDeg;
    redrawOverlay();
    return;
  }
  if (!drawing) return;
  dragCurrent = getCanvasPoint(evt);
  redrawOverlay();
});
window.addEventListener("pointerup", (evt) => {
  if (isPanning) {
    isPanning = false;
    panStart = null;
    if (pointerLockActive && document.exitPointerLock) {
      document.exitPointerLock();
    }
    pointerLockActive = false;
    setOverlayCursor();
    return;
  }
  if (draggingBadge) {
    draggingBadge = null;
    dragBadgeStartCanvasPt = null;
    dragBadgeStartOffset = null;
    setOverlayCursor();
    scheduleAutoSave();
    return;
  }
  if (draggingText) {
    draggingText = null;
    setOverlayCursor();
    redrawOverlay();
    scheduleAutoSave();
    return;
  }
  if (resizingHandle) {
    resizingHandle = null;
    setOverlayCursor();
    redrawOverlay();
    scheduleAutoSave();
    return;
  }
  if (movingRect) {
    movingRect = null;
    setOverlayCursor();
    redrawOverlay();
    scheduleAutoSave();
    return;
  }
  if (rotatingHandle) {
    rotatingHandle = null;
    setOverlayCursor();
    redrawOverlay();
    scheduleAutoSave();
    return;
  }
  if (!drawing) return;
  drawing = false;
  const end = getCanvasPoint(evt);
  finalizeRect(dragStart, end);
  dragStart = null;
  dragCurrent = null;
  redrawOverlay();
});

function updateRepeatButtonLabel() {
  const btn = el("btnRepeatToggle");
  if (!btn) return;
  btn.textContent = repeatMode && lastNumber !== null
    ? `同じ番号で連続中（#${lastNumbers ? formatNumberList(lastNumbers) : lastNumber}）`
    : "同じ番号で連続";
}

function finalizeRect(start, end) {
  const sw = Math.abs(end.x - start.x);
  const sh = Math.abs(end.y - start.y);
  if (sw < 6 || sh < 6) return; // too small, ignore accidental click

  const c1 = currentViewport.convertToPdfPoint(start.x, start.y);
  const c2 = currentViewport.convertToPdfPoint(end.x, end.y);
  const x = Math.min(c1[0], c2[0]);
  const y = Math.min(c1[1], c2[1]);
  const w = Math.abs(c2[0] - c1[0]);
  const h = Math.abs(c2[1] - c1[1]);

  const repeating = repeatMode && lastNumber !== null;
  const assignedNumbers = repeating ? (lastNumbers ? lastNumbers.slice() : [lastNumber]) : [nextNumber()];
  const assignedNumber = assignedNumbers[0];
  lastNumber = assignedNumber;
  lastNumbers = assignedNumbers.slice();

  const ann = {
    id: nextId++,
    page: currentPage,
    x, y, w, h,
    number: assignedNumber,
    numbers: assignedNumbers,
    note: "",
    color: lastColor,
    borderWidth: globalBorderWidth,
    opacity: globalOpacity,
    numOffsetX: null, // unset = use each renderer's own accurate default (screen px for preview, points for export)
    numOffsetY: null,
    fontSize: globalFontSize,
    showLeader: false,
    rotation: 0,
  };
  pushUndo();
  annotations.push(ann);
  updateRepeatButtonLabel();
  lastAddedAnnId = ann.id;
  updateSidebar();
}

function nextNumber() {
  const used = new Set(annotations.flatMap(a => annNumbers(a)));
  let n = 1;
  while (used.has(n)) n++;
  return n;
}

// ---------- Sidebar ----------
let lastAddedAnnId = null;
let lastAddedTextId = null;
function updateSidebar() {
  const list = el("annotationList");
  el("markerCountLabel").textContent = `マーカー ${annotations.length}件`;
  scheduleAutoSave();
  updateTextNoteList();

  if (annotations.length === 0) {
    list.innerHTML = "";
    let empty = document.getElementById("sidebarEmpty");
    if (!empty) {
      empty = document.createElement("div");
      empty.id = "sidebarEmpty";
      empty.textContent = "まだマーカーがありません。左側の図面上をドラッグして矩形を作成してください。カードをクリックすると該当ページへジャンプします。";
    }
    list.appendChild(empty);
    return;
  }

  const dupSet = findDuplicateNumbers();
  const sorted = [...annotations].sort((a, b) => a.number - b.number);
  list.innerHTML = "";
  sorted.forEach(a => list.appendChild(buildAnnCard(a, annNumbers(a).filter(n => dupSet.has(n)))));

  if (lastAddedAnnId != null) {
    const targetId = lastAddedAnnId;
    lastAddedAnnId = null;
    requestAnimationFrame(() => {
      const cardEl = list.querySelector(`[data-ann-id="${targetId}"]`);
      if (cardEl) cardEl.scrollIntoView({ behavior: "smooth", block: "nearest" });

function updateTextNoteList() {

    requestAnimationFrame(() => {

function findDuplicateNumbers() {
  const seen = new Map();
  annotations.forEach(a => annNumbers(a).forEach(n => seen.set(n, (seen.get(n) || 0) + 1)));
  const dup = new Set();
  seen.forEach((count, num) => { if (count > 1) dup.add(num); });
  return dup;
}

// Only used when "番号をスライド" mode is active — inserting a number that
// collides with an existing one shifts that one (and everything above it) up
// by one instead of creating a duplicate.
// e.g. 1–10 exist, a marker is set to 5 → old 5–10 become 6–11, this one is 5.
// With multi-number markers the same idea is applied to each number in turn
// (smallest first): whenever one collides with a number already used by
// another marker, every number ≥ it on the other markers moves up by one.
// e.g. 1–10 exist and marker 2 becomes 2,3,4 → old 3–10 become 5–12;
//      marker 2 becomes 2,7 → old 7–10 become 8–11.
function insertNumberWithShift(targetId, newNumbers) {
  const target = annotations.find(a => a.id === targetId);
  if (!target) return;
  if (!Array.isArray(newNumbers)) newNumbers = [newNumbers];
  const wanted = [...new Set(newNumbers)].sort((p, q) => p - q);
  setAnnNumbers(target, wanted);
  const others = annotations.filter(a => a.id !== targetId);
  for (const n of wanted) {
    if (others.some(a => annNumbers(a).includes(n))) {
      others.forEach(a => setAnnNumbers(a, annNumbers(a).map(m => (m >= n ? m + 1 : m))));
    }
  }
}

function buildAnnCard(a, dupNums) {

  card.className = "annCard" + (isDup ? " dupWarning" : "");

  const row1 = document.createElement("div");
  row1.className = "row1";

  const badge = document.createElement("input");
  badge.type = "text";
  badge.inputMode = "numeric";
  badge.className = "numBadge";
  badge.style.background = COLORS[a.color].hex;
  badge.value = annLabel(a);
  badge.style.width = badge.style.minWidth = badge.style.maxWidth = Math.max(38, badge.value.length * 7 + 14) + "px";
  badge.title = "番号を編集できます（「2-4」で②③④、「2,7」で②⑦、「2-4,7」で②③④⑦）";
  badge.addEventListener("click", (ev) => ev.stopPropagation());
  badge.addEventListener("focus", (ev) => ev.target.select());
  function commitBadge(ev) {
    const spec = parseNumberSpec(ev.target.value);
    if (!spec || spec.error) {
      if (spec && spec.error) setDraftStatus(spec.error, true);
      ev.target.value = annLabel(a); // revert
      return;
    }
    applyNumberSpec(a, spec);
    updateRepeatButtonLabel();
    updateSidebar();
    redrawOverlay();
  }
  badge.addEventListener("blur", commitBadge);
  badge.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.target.blur(); }
    if (ev.key === "Escape") { ev.target.value = annLabel(a); ev.target.blur(); }
  });

  const pageTag = document.createElement("span");
  pageTag.className = "pageTag";
  pageTag.textContent = `p.${a.page}`;

  const delBtn = document.createElement("button");
  delBtn.className = "delBtn";
  delBtn.textContent = "削除";
  delBtn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    pushUndo();

    redrawOverlay();

  // Stepper: how many consecutive numbers this frame carries (1 → ②, 3 → ②③④)

  stepper.title = "＋で最後の番号の次を追加、−で最後の番号を外します。飛び番号は番号欄に「2,7」のように入力します";
  const changeCount = (delta) => (ev) => {
    ev.stopPropagation();
    const cur = annNumbers(a);
    let next;
    if (delta > 0) { if (cur.length >= MAX_BADGE_COUNT) return; next = [...cur, cur[cur.length - 1] + 1]; }
    else { if (cur.length <= 1) return; next = cur.slice(0, -1); }

    updateSidebar();
    redrawOverlay();

  const minusBtn = document.createElement("button");

  row1.appendChild(pageTag);

  const colorRow = document.createElement("div");

  swatches.className = "swatches";
  Object.keys(COLORS).forEach(key => {

  leaderToggle.appendChild(leaderCheckbox);
  leaderToggle.appendChild(document.createTextNode("線描写"));
  colorRow.appendChild(leaderToggle);

  const annDefault = defaultBadgeOffsetPt(a);
  const curOffX = a.numOffsetX ?? annDefault.x;
  const curOffY = a.numOffsetY ?? annDefault.y;
  let row2 = null;
  if (Math.abs(curOffX - annDefault.x) > 0.5 || Math.abs(curOffY - annDefault.y) > 0.5) {
    row2 = document.createElement("div");

  card.addEventListener("click", async () => {
    if (a.page !== currentPage) {

      await renderPage(currentPage);

    redrawOverlay();
  });

  return card;
}

// ---------- Export (vector overlay onto original PDF — no rasterization) ----------
el("btnExport").addEventListener("click", exportPdf);

async function exportPdf() {
  if (!pdfBytesOriginal) return;
  const btn = el("btnExport");
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "書き出し中...";

  try {
    const { PDFDocument, rgb, StandardFonts, degrees } = PDFLib;
    const pdfDoc = await PDFDocument.load(pdfBytesOriginal.slice(0));
    const pages = pdfDoc.getPages();
    const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

    // Helvetica only supports WinAnsi (Latin) characters. Free-text notes can
    // contain Japanese or other non-Latin text, which needs a real Unicode
    // font — fetched and embedded only when there's actual text to draw.
    // A modern, correctly-fixed fontkit (loaded as window.fontkit above) lets
    // us safely subset a comprehensive Japanese TTF, keeping the exported
    // file small (only the actually-used glyphs are embedded) while still
    // covering uncommon kanji correctly.
    let jpFont = font;
    let jpFontError = null;
    const hasFreeText = textNotes.some(t => t.text && t.text.trim() !== "");
    if (hasFreeText) {
      const candidates = [
        { url: "https://raw.githubusercontent.com/googlefonts/morisawa-biz-ud-gothic/main/fonts/ttf/BIZUDGothic-Bold.ttf", subset: true },
        { url: "https://cdn.jsdelivr.net/gh/googlefonts/morisawa-biz-ud-gothic@main/fonts/ttf/BIZUDGothic-Bold.ttf", subset: true },
        // Last-resort fallback if the modern fontkit failed to load or the
        // above font is unreachable: full (un-subset) embed of a comprehensive
        // CJK font — larger file, but has been separately verified reliable.
        { url: "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf", subset: false },
      ];
      let fontkitLoadErr = null;
      try {
        await ensureFontkitLoaded();
      } catch (loadErr) {
        console.error("fontkit lazy-load failed:", loadErr);
        fontkitLoadErr = String((loadErr && loadErr.message) || loadErr);
      }
      if (typeof fontkit === "undefined") {
        jpFontError = "fontkitライブラリの読み込みに失敗しました" + (fontkitLoadErr ? ": " + fontkitLoadErr : "（原因不明）");
      } else {
        pdfDoc.registerFontkit(fontkit);
        for (const candidate of candidates) {
          try {
            const res = await fetch(candidate.url);
            if (!res.ok) throw new Error("HTTP " + res.status + " for " + candidate.url);
            const jpFontBytes = await res.arrayBuffer();
            jpFont = await pdfDoc.embedFont(jpFontBytes, { subset: candidate.subset });
            jpFontError = null;
            break;
          } catch (fontErr) {
            console.error("Japanese font fetch/embed failed for", candidate.url, fontErr);
            jpFontError = String((fontErr && fontErr.message) || fontErr);
            jpFont = font;
          }
        }
      }
    }

    annotations.forEach(a => {
      const page = pages[a.page - 1];
      if (!page) return;
      const c = COLORS[a.color] || COLORS[DEFAULT_COLOR];
      const color = rgb(c.rgb[0], c.rgb[1], c.rgb[2]);
      const bw = a.borderWidth ?? DEFAULT_BORDER_WIDTH;
      const op = a.opacity ?? DEFAULT_OPACITY;
      const theta = a.rotation || 0;
      const pageRotation = page.getRotation().angle || 0;
      // NOTE: unlike text (drawn "flat" and needing counter-rotation — see
      // below), the rectangle's x/y/w/h were already computed via
      // convertToPdfPoint when the user drew it, which is itself aware of
      // the page's rotation. So only the user's OWN intentional rotation
      // (theta, from the rotate handle) needs to be passed to pdf-lib here —
      // adding pageRotation again would rotate it a second time.
      const effectiveTheta = theta;

      const rectOpts = {
        x: a.x, y: a.y, width: a.w, height: a.h,
        color: color,
        opacity: op,
      };
      if (effectiveTheta % 360 !== 0) {
        // pdf-lib rotates a rectangle around its own (x,y) anchor. To match
        // the preview's center-pivot rotation, move the anchor to where the
        // original bottom-left corner ends up after rotating around the
        // center (rotatedCorners()[0]) — rotating the w×h box from THAT
        // point by the same angle produces an identical result.
        const corner0 = rotatedCorners({ x: a.x, y: a.y, w: a.w, h: a.h, rotation: effectiveTheta })[0];
        rectOpts.x = corner0.x;
        rectOpts.y = corner0.y;
        rectOpts.rotate = degrees(effectiveTheta);
      }
      if (bw > 0) {
        rectOpts.borderColor = color;
        rectOpts.borderWidth = bw;
        rectOpts.borderOpacity = 0.95;
      }
      page.drawRectangle(rectOpts);

      const fontSize = a.fontSize ?? DEFAULT_FONT_SIZE;
      const exportRadius = (n) => Math.max(fontSize * 0.62, font.widthOfTextAtSize(String(n), fontSize) / 2) + 2.5;
      const badgePt = badgeCenterPt(a); // same rotation-aware math as the preview
      const cx = badgePt.x, cy = badgePt.y;
      const tRgb = c.textRgb || [1, 1, 1];
      const textColor = rgb(tRgb[0], tRgb[1], tRgb[2]);

      if (a.showLeader) {
        const corner = nearestCorner(a); // same rotation-aware nearest-corner logic
        page.drawLine({
          start: { x: corner.x, y: corner.y },
          end: { x: cx, y: cy },
          thickness: 0.5,
          color: color,
          opacity: 0.85,
          dashArray: [4, 3],
        });
      }

      badgeCirclesPt(a, exportRadius).forEach(ci => {
        page.drawEllipse({
          x: ci.x, y: ci.y, xScale: ci.r, yScale: ci.r,
          color: color,
          borderColor: rgb(1, 1, 1),
          borderWidth: 1,
          opacity: 1,
        });
        const label = String(ci.n);
        const textWidth = font.widthOfTextAtSize(label, fontSize);
        const labelRawAnchor = { x: ci.x - textWidth / 2, y: ci.y - fontSize * 0.35 };
        const labelAnchor = pageRotation
          ? rotatePdfPointAroundCenter(labelRawAnchor, { x: ci.x, y: ci.y }, pageRotation)
          : labelRawAnchor;
        page.drawText(label, {
          x: labelAnchor.x,
          y: labelAnchor.y,
          size: fontSize,
          font,
          color: textColor,
          rotate: pageRotation ? degrees(pageRotation) : undefined,
        });
      });
    });

    let skippedTextLines = 0;
    textNotes.forEach(t => {
      const page = pages[t.page - 1];
      if (!page || !t.text) return;
      const c = COLORS[t.color] || COLORS[DEFAULT_COLOR];
      const color = rgb(c.rgb[0], c.rgb[1], c.rgb[2]);
      const fontSize = t.fontSize ?? DEFAULT_TEXT_FONT_SIZE;
      const lineHeight = fontSize * 1.2;
      const lines = t.text.split("\n");
      const pageRotation = page.getRotation().angle || 0;
      const pivot = { x: t.x, y: t.y };
      lines.forEach((line, i) => {
        try {
          const rawAnchor = { x: t.x, y: t.y - i * lineHeight };
          const anchor = pageRotation
            ? rotatePdfPointAroundCenter(rawAnchor, pivot, pageRotation)
            : rawAnchor;
          page.drawText(line, {
            x: anchor.x,
            y: anchor.y,
            size: fontSize,
            font: jpFont,
            color: color,
            rotate: pageRotation ? degrees(pageRotation) : undefined,
          });
        } catch (lineErr) {
          skippedTextLines++;
          console.error("Skipped a text-note line that couldn't be encoded:", line, lineErr);
        }
      });
    });

    const outBytes = await pdfDoc.save();
    const blob = new Blob([outBytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = timestampedFileName("pdf");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    if (jpFontError || skippedTextLines > 0) {
      alert(
        "PDFは書き出されましたが、追加した文字の一部が反映されていない可能性があります。\n\n" +
        (jpFontError ? "日本語フォントの読み込みに失敗しました: " + jpFontError + "\n\n" : "") +
        (skippedTextLines > 0 ? `反映できなかった行: ${skippedTextLines}件\n\n` : "") +
        "この内容をそのままサポートに伝えていただけると、原因の特定に役立ちます。"
      );
    }
  } catch (err) {
    console.error(err);
    alert("書き出し中にエラーが発生しました: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}
</script>
</body>
</html>
